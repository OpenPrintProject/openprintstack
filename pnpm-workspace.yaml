packages:
  - apps/*
  - packages/*

# One version of each shared dependency across the workspace. zod in particular
# must have a single copy, because schema metadata lives in its global registry.
catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^26.6.4
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  prettier: ^3.9.9
  # typescript-eslint supports TypeScript <6.1.0, so stay on 6.0.x until it supports newer releases.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  # Vitest runs on Vite too, so the web app and the tests share one copy.
  vite: ^8.3.2
  vitest: ^5.0.3
  zod: ^4.6.5

# Dependencies whose install scripts may run. pnpm refuses to install while any
# dependency's script is neither allowed nor denied.
allowBuilds:
  # drizzle-kit's esbuild. Its script only checks the platform binary, which
  # drizzle-kit doesn't need.
  esbuild: false

# Scripts run in pnpm's own bash-like shell on every platform, so a script
# such as `OPS_ENV=development node --watch src/main.ts` works on Windows too,
# where pnpm would otherwise use cmd.exe.
shellEmulator: true
